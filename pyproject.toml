[project]
name = "adversary"
version = "0.1.0"
description = "Coverage-driven adversarial discovery and repair for foundation models"
requires-python = "==3.13.*"
dependencies = [
    # configuration and artifact utilities
    "pydantic>=2.12",
    "pyyaml>=6.0",
    "jsonlines>=4.0",
    "rich>=14.0",
    "tqdm>=4.67",
    # data + inference (CPU/MPS locally; real runs go to a GPU box)
    "torch>=2.6",
    "transformers>=4.56",
    "datasets>=3.0",
    "numpy>=2.0",
    "pandas>=2.2",
    "pyarrow>=17.0",
    # statistics for excess-over-additive, McNemar, TOST
    "scipy>=1.14",
    "statsmodels>=0.14",
    "matplotlib>=3.9",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["adversary*", "domains*"]
namespaces = true

[tool.setuptools.package-data]
"domains.swe_agents" = ["corpus/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = ["kitchen", "archive", "docs", "superseded"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ANN"]
ignore = ["ANN401"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ANN", "E501"]
